name: Build and Release Windows Executable

on:
  push:
    tags:
      - 'v*' # 当推送形如 v1.0.0, v1.0.6.0 的 Tag 时自动触发构建发布
  workflow_dispatch: # 允许在 GitHub Actions 页面手动点击按钮触发构建

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet Packages
      run: nuget restore Eve.TapToClick.sln

    - name: Build Application (Release)
      run: msbuild Eve.TapToClick.sln /p:Configuration=Release /p:Platform="Any CPU"

    - name: Prepare Release Package
      shell: powershell
      run: |
        # 创建发布输出文件夹
        New-Item -ItemType Directory -Force -Path "./release-artifacts"
        
        # 复制 Release 输出的 bin 文件到发布目录
        # (避开 Installer 项目，仅打包 Eve.TapToClick 的核心输出)
        Copy-Item -Path "Eve.TapToClick\bin\Release\*" -Destination "./release-artifacts" -Recurse -Force
        
        # 打包为 zip 文件
        Compress-Archive -Path "./release-artifacts\*" -DestinationPath "Eve.TapToClick.zip"

    - name: Upload Artifact to Workflow
      uses: actions/upload-artifact@v4
      with:
        name: Eve.TapToClick-Executable
        path: Eve.TapToClick.zip
    
    - name: Create GitHub Release
          # 只要是推送 Tag 或者 手工触发（workflow_dispatch），就创建 Release
          if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
          uses: softprops/action-gh-release@v2
          with:
            # 手工触发时，若没有 tag，自动使用自定义的名字/当前分支作为发布标识
            tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('manual-{0}', github.run_number) }}
            name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Manual Build #{0}', github.run_number) }}
            files: |
              Eve.TapToClick.zip
              Eve.TapToClick/bin/Release/Eve.TapToClick.exe
            draft: false
            prerelease: false
            generate_release_notes: true
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
